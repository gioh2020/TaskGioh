<div class="form-card">
  <h2 class="form-title">{{ userToEdit() ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="name">Nombre completo *</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Ej: Juan Pérez"
        [class.input-error]="isInvalid('name')"
      />
      @if (isInvalid('name')) {
        <span class="error-msg">El nombre es obligatorio.</span>
      }
    </div>

    <div class="field" [class.disabled-field]="userToEdit()">
      <label for="email">Correo electrónico {{ userToEdit() ? '(No editable)' : '*' }}</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Ej: juan@empresa.com"
        [class.input-error]="isInvalid('email')"
      />
      @if (isInvalid('email') && !userToEdit()) {
        <span class="error-msg">Ingresa un correo válido.</span>
      }
    </div>

    @if (userService.error()) {
      <div class="alert alert-error">{{ userService.error() }}</div>
    }

    @if (successMsg) {
      <div class="alert alert-success">{{ successMsg }}</div>
    }

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancelar
      </button>
      <button
        type="submit"
        class="btn"
        [class.btn-create]="!userToEdit()"
        [class.btn-primary]="userToEdit()"
        [disabled]="userForm.invalid || submitting"
      >
        @if (submitting) { Guardando... } @else { {{ userToEdit() ? 'Guardar Cambios' : 'Crear usuario' }} }
      </button>
    </div>
  </form>
</div>
